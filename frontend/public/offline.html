<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ff6b3d" />
    <title>اتصال اینترنت برقرار نیست | ن وان</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem;
        font-family: Vazirmatn, Tahoma, sans-serif;
        color: #f6f1e8;
        background: #0d0d0d;
      }
      .box { max-width: 26rem; text-align: center; }
      .mark { width: 84px; height: 84px; margin: 0 auto 1.75rem; }
      h1 { margin: 0 0 .75rem; font-size: 1.4rem; font-weight: 800; }
      p { margin: 0 0 1.75rem; color: #96918a; font-size: .95rem; line-height: 2; }
      button {
        padding: .85rem 2rem;
        font: inherit;
        font-weight: 800;
        color: #fff;
        cursor: pointer;
        border: 0;
        border-radius: 14px;
        background: #ff6b3d;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <svg class="mark" viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
        <rect width="48" height="48" rx="14" fill="#ff6b3d" />
        <path d="M13 16 L13 22 A11 11 0 0 0 35 22 L35 16" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" />
        <circle cx="24" cy="13" r="2.9" fill="#fff" />
      </svg>
      <h1>اتصال اینترنت برقرار نیست</h1>
      <p>برای مشاهده‌ی این صفحه به اینترنت نیاز دارید. لطفاً اتصال خود را بررسی کنید و دوباره تلاش کنید.</p>
      <button type="button" onclick="location.reload()">تلاش دوباره</button>
    </div>
  </body>
</html>
