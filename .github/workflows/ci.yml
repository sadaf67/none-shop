name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: n_one_ci
          POSTGRES_USER: n_one_ci
          POSTGRES_PASSWORD: ci-database-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U n_one_ci -d n_one_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DEBUG: "False"
      SECRET_KEY: "CI!4zN8vQ2xM7pL5sK9dR3wT6yU1aF8hJ4cB7eG2mP5qS9vX3zN6"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver,backend
      CSRF_TRUSTED_ORIGINS: https://shop.example.test
      FRONTEND_URL: https://shop.example.test
      DATABASE_URL: postgresql://n_one_ci:ci-database-password@127.0.0.1:5432/n_one_ci
      DB_SSLMODE: disable
      ZARINPAL_MERCHANT_ID: 00000000-0000-0000-0000-000000000000
      ZARINPAL_SANDBOX: "False"
      SECURE_HSTS_SECONDS: "3600"
      SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
      SECURE_SSL_REDIRECT: "True"
      SESSION_COOKIE_SECURE: "True"
      CSRF_COOKIE_SECURE: "True"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py check
      - run: python manage.py check --deploy --fail-level WARNING
      - run: python manage.py test
        env:
          DEBUG: "True"
          SECURE_SSL_REDIRECT: "False"
          SESSION_COOKIE_SECURE: "False"
          CSRF_COOKIE_SECURE: "False"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_API_BASE_URL: /api
          VITE_PUBLIC_URL: https://shop.example.test
          VITE_FREE_SHIPPING_THRESHOLD: "500000"
          VITE_FLAT_SHIPPING_COST: "30000"

  containers:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.production.example .env.production
      - run: docker compose --env-file .env.production -f docker-compose.production.yml config --quiet
      - run: docker compose --env-file .env.production -f docker-compose.production.yml build
