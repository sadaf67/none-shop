user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /dev/stdout main;
    error_log /dev/stderr warn;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    upstream django_backend {
        server backend:8000;
        keepalive 16;
    }

    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        client_max_body_size 10m;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

        # هدرهای پراکسی یک‌بار تعریف می‌شوند و همه location های proxy_pass آن‌ها را به ارث می‌برند.
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection "";

        location = /health {
            return 308 /health/;
        }

        location = /api {
            return 308 /api/;
        }

        location = /django-admin {
            return 308 /django-admin/;
        }

        location = /health/ {
            proxy_pass http://django_backend;
        }

        location ^~ /api/ {
            proxy_pass http://django_backend;
        }

        location ^~ /django-admin/ {
            proxy_pass http://django_backend;
        }

        # ─── سئو و فیدهای مقایسه قیمت ───
        # این مسیرها را جنگو می‌سازد. تطبیق دقیق (=) بر location / اولویت دارد،
        # بنابراین robots.txt استاتیک داخل dist هرگز جلوی نسخه داینامیک را نمی‌گیرد.
        location = /robots.txt {
            proxy_pass http://django_backend;
        }

        location = /sitemap.xml {
            proxy_pass http://django_backend;
        }

        # فید ترب و ایمالز؛ خزنده‌ها این فایل‌ها را چند بار در روز می‌خوانند.
        location ^~ /feeds/ {
            proxy_pass http://django_backend;
            proxy_read_timeout 120s;
        }

        location ^~ /static/ {
            alias /var/www/static/;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location ^~ /media/ {
            alias /var/www/media/;
            access_log off;
            expires 7d;
            add_header Cache-Control "public, max-age=604800";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /index.html {
            expires -1;
            add_header Cache-Control "no-store";
        }

        # سرویس‌ورکر هرگز کش نمی‌شود؛ در غیر این صورت کاربر روی نسخه قدیمی PWA گیر می‌کند.
        location = /sw.js {
            expires -1;
            add_header Cache-Control "no-store";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location = /manifest.webmanifest {
            expires 1h;
            add_header Cache-Control "public, max-age=3600";
            add_header X-Content-Type-Options "nosniff" always;
        }

        location /assets/ {
            try_files $uri =404;
            access_log off;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
